name: Build & Publish to Latest Release

on:
  release:
    types: [released]

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud Latest
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/latest.zip -O ${{ env.DALAMUD_HOME }}.zip
          unzip ${{ env.DALAMUD_HOME }}.zip -d ${{ env.DALAMUD_HOME }}

      - name: Restore Project
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release AoAoEnergy/AoAoEnergy.csproj -p:AssemblyVersion=${{ github.ref_name }}

      - name: 'Upload to GitHub release'
        run: |
            gh release upload ${{github.event.release.tag_name}} AoAoEnergy/bin/Release/AoAoEnergy/latest.zip
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash
